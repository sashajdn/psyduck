global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s
  external_labels:
    service: psyduck
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    honor_timestamps: true
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          component: prometheus

  - job_name: grafana
    metrics_path: /metrics
    honor_timestamps: true
    static_configs:
      - targets:
          - grafana:3000
        labels:
          component: grafana

  - job_name: psyduck
    metrics_path: /metrics
    honor_labels: true
    static_configs:
      - targets:
          - host.docker.internal:9464
        labels:
          component: psyduck
